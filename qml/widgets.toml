# --- desktop ---------------------------------------------------------------------------------

[[widget]]
type = "desktop-clock"
name = "Clock"
icon = "schedule"
placements = ["desktop"]
component = "modules/rusty/background/widgets/clock/DesktopClock.qml"
enabledBy = "background.widgets.clock.enable"
size = { min = [120, 80], max = [1600, 1000], default = [320, 200] }

[[widget]]
type = "desktop-weather"
name = "Weather"
icon = "partly_cloudy_day"
placements = ["desktop"]
component = "modules/rusty/background/widgets/weather/DesktopWeather.qml"
enabledBy = "background.widgets.weather.enable"
size = { min = [100, 100], max = [800, 800], default = [200, 200] }


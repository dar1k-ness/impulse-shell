[[widget]]
type = "systray"
name = "System tray"
icon = "apps"
placements = ["panel"]
component = "modules/rusty/bar/panel/SysTrayWidget.qml"
size = { min = [24, 24], default = [24, 24] }

[[widget]]
type = "weather"
name = "Weather"
icon = "partly_cloudy_day"
placements = ["panel"]
component = "modules/rusty/bar/panel/WeatherWidget.qml"
size = { min = [24, 24], default = [24, 24] }

[[widget]]
type = "spacer"
name = "Spacer"
icon = "space_bar"
placements = ["panel"]

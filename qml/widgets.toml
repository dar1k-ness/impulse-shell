size = { min = [24, 24], default = [24, 24] }
pill = true

[[widget]]
type = "clock"
name = "Clock"
icon = "schedule"
placements = ["panel"]
component = "modules/rusty/bar/panel/ClockWidget.qml"
size = { min = [24, 24], default = [24, 24] }
pill = true

[[widget.setting]]
key = "showDate"
label = "Show date"
kind = "bool"
default = true

[[widget]]
type = "util-buttons"
name = "Utility buttons"
icon = "build"
placements = ["panel"]
component = "modules/rusty/bar/panel/UtilButtonsWidget.qml"
size = { min = [24, 24], default = [24, 24] }
pill = true

[[widget]]
type = "battery"
name = "Battery"
icon = "battery_full"
placements = ["panel"]
component = "modules/rusty/bar/panel/BatteryWidget.qml"
size = { min = [24, 24], default = [24, 24] }

# Widget types of the edit-mode layout (Impulse widget registry), grouped by the surface they
# first belong to, in the order panel / sidebar. A type on one surface lists it in `placements`;
# a type on several has a `[widget.panel]` / `[widget.desktop]` / `[widget.sidebar]` table each,
# with that surface's component and size, and one settings schema for all of them. Sizes are
# logical pixels [width, height], except on the sidebar, where width is cells of its grid's
# `columns`; a least width of 64 there (the most columns a sidebar may have) is the whole width
# of any sidebar: a block with no form for a row of cells. `listed = false` in a surface table
# keeps the type out of edit mode's "Add widget" for that surface: the quick toggles get to the
# sidebar by the pencil of its quick toggles.

# --- panel -----------------------------------------------------------------------------------

[[widget]]
type = "left-sidebar-button"
name = "Left sidebar button"
icon = "side_navigation"
placements = ["panel"]
component = "modules/rusty/bar/panel/LeftSidebarButtonWidget.qml"
size = { min = [24, 24], default = [24, 24] }


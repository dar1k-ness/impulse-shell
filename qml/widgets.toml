# Widget types of the widget layout (Impulse widget registry): one section per container
# kind, in the order panel / desktop / sidebar. Sizes are logical pixels [width, height], except
# in the sidebar section, where width is cells of the sidebar grid's `columns`.

# --- panel -----------------------------------------------------------------------------------

[[widget]]
type = "left-sidebar-button"
name = "Left sidebar button"
icon = "side_navigation"
placements = ["panel"]
component = "modules/rusty/bar/panel/LeftSidebarButtonWidget.qml"
size = { min = [24, 24], default = [24, 24] }

[[widget]]
type = "active-window"
name = "Active window"
icon = "web_asset"
placements = ["panel"]
component = "modules/rusty/bar/panel/ActiveWindowWidget.qml"
size = { min = [80, 24], default = [80, 24] }

[[widget]]
type = "resources"
name = "Resources"
icon = "memory"
placements = ["panel"]
component = "modules/rusty/bar/panel/ResourcesWidget.qml"
size = { min = [24, 24], default = [24, 24] }
pill = true

[[widget]]
type = "media"
name = "Media"
icon = "music_note"
placements = ["panel"]
component = "modules/rusty/bar/panel/MediaWidget.qml"
size = { min = [24, 24], default = [24, 24] }
pill = true

[[widget]]
type = "workspaces"
name = "Workspaces"
icon = "workspaces"
placements = ["panel"]

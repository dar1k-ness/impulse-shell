[package]
name = "wallpick"
version = "0.1.0"
description = "Wallpaper and accent picker for rusty-impulse: MobileCLIP-S0 scoring against text preferences and a learned taste model"
edition.workspace = true
license.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rand = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tract-onnx = "0.23"
unicode-normalization = "0.1"
ureq = "3"

[dev-dependencies]
tempfile = "3"

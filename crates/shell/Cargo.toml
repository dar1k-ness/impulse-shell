[package]
name = "shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "impulse-shell"
path = "src/main.rs"

# Developer tools (offscreen bar render, headless flood benchmark): each is another full
# thin-LTO link of the compiled tree, so the shipped build skips them.
[[bin]]
name = "barshot"
required-features = ["tools"]

[[bin]]
name = "sceneflood"
required-features = ["tools"]

# Headless EGL renders of the original windows compared across GL drivers (tools/reference/kaggle-gpu).
[[bin]]
name = "gpushot"
required-features = ["tools"]


# Integration tests that drive QML through the interpreter: without `interp` cargo skips them
# (and says so) instead of building an empty test binary that passes with 0 tests.

[dependencies]
bits = { path = "../bits" }
elog = { path = "../elog" }
mul255 = { path = "../mul255" }
tracing.workspace = true
rustc-hash.workspace = true
lru.workspace = true
libc.workspace = true
inotify.workspace = true
tikv-jemallocator = { version = "0.6.1", features = ["unprefixed_malloc_on_supported_platforms"] }
tikv-jemalloc-ctl = { version = "0.6.1", features = ["stats"] }
serde.workspace = true
serde_json.workspace = true
qml = { path = "../qml", default-features = false, features = ["pipewire"] }
qsg = { path = "../qsg" }
icu_segmenter = { version = "~2.3", default-features = false, features = ["compiled_data"] }
# line_break: libthai, opened when a text has Thai in it, as Qt does.
libloading.workspace = true
image = { workspace = true, features = ["gif", "webp"] }
# The readers `image` decodes GIF and WebP with: movie.rs reads an animation's frames one at
# a time with them.
gif = "0.14"
image-webp = "0.2"
workpool = { path = "../workpool" }
ricompiled = { path = "../ricompiled", default-features = false }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
xkbcommon = { workspace = true, features = ["wayland"] }
wayland-client.workspace = true
wayland-protocols = { workspace = true, features = ["staging", "unstable"] }
wayland-protocols-hyprland = { version = "1.2", features = ["client"] }
wayland-protocols-wlr.workspace = true
calloop = "0.14"
glow = "0.18"
gbm = { version = "0.18", default-features = false }
wayland-egl = "0.32"
khronos-egl = { version = "6", features = ["dynamic"] }
wayland-backend = { version = "0.3", features = ["client_system"] }

[[test]]
name = "assistant_session"
# The test binary is also the fake ACP agent it runs (see the file).
harness = false

[[test]]
name = "panic_ends"
# The test binary is also the process that panics in its main thread (see the file).
harness = false

[features]
# No JavaScript interpreter in the shipped shell (`cargo build --release -p shell`,
# tools/install.sh): it runs the code compiled from the QML tree at RI_ROOT and refuses to
# start on a tree that differs from it. `interp` is for tests and parity tooling only
# (with RI_INTERP=1 it interprets every script).
default = []
interp = ["qml/interp"]
tools = []

[dev-dependencies]
flate2 = "1"
testenv = { path = "../testenv" }
# The scenes of tests/scenes, compiled: they run without the interpreter too.
testscenes = { path = "../testscenes" }
# qml/tests/support/route_device.rs, the Route-backed sink of sidebar_volume_writes.
pipewire = "0.10.1"
turbojpeg.workspace = true
imgtools = { path = "../imgtools" }
tempfile.workspace = true
# The tray items and the notification tray_pixels_qt serves to Quickshell and to us, and
# icon_request_scale_equiv's StatusNotifierItems, and notification_clear_all_equiv's sender.
zbus.workspace = true
wayland-protocols-misc.workspace = true
# The harness of assistant_session and panic_ends: libtest's command line and output.
libtest-mimic = "0.8"

[lints]
workspace = true

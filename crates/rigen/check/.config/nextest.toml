# cargo-nextest for this workspace (tools/testenv/ri-gate's rigen step), as in the main one: a
# test that runs for 60 s is reported as slow, and killed (failing) after 5 periods.
nextest-version = { required = "0.9.151" }

[profile.default]
slow-timeout = { period = "60s", terminate-after = 5 }
fail-fast = false

[profile.gate]

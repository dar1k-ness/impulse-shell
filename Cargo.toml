# regress 0.12.0 with the legacy (no u flag) Canonicalize of ECMA-262 §22.2.2.7.3 and the
# Annex B `\u{` IdentityEscape and `\uXXXX` surrogate escapes; vendor/regress/PATCHED.md lists the
# patch.
[patch.crates-io]
regress = { path = "vendor/regress" }

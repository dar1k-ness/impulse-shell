[workspace]
resolver = "3"
members = ["crates/*", "crates/ricompiled/parts/p*"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
# The toolchain rust-toolchain.toml pins; resolver 3 picks dependency versions that support it.
rust-version = "1.99"

# Third-party crates more than one member uses, declared once (Cargo Book, "Inheriting a
# dependency from a workspace"). Members inherit with `name.workspace = true` and may only add
# features; a crate that needs no default features anywhere has them off here.
[workspace.dependencies]
async-io = "2"
futures-lite = "2"
image = { version = "0.25", default-features = false }
inotify = { version = "0.11", default-features = false }
libc = "0.2"
libloading = "0.9"
lru = "0.19"
md-5 = "0.10"
png = "0.18"
roxmltree = "0.21"
rustc-hash = "2"
serde = "1"
serde_json = "1"
svgtypes = "0.16"
tempfile = "3"
toml = "1"
tracing = "0.1"
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.9", default-features = false }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Unsafe hygiene for the FFI crates that opt in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
# An ignored test says why: tools/ci/skipped-tests lists the reasons.
ignore_without_reason = "warn"

# The installed shell (tools/install.sh). Without its symbol table, which nothing reads at
# run time: about a fifth of the file.
[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"

# tools/testenv/ri-gate's builds of the shipped shell (the shipped-* steps): release code
# without the cross-crate LTO only installs need (Cargo Book "Profiles > Custom profiles";
# package overrides below are inherited). The symbol names stay: shipped_binary looks for the
# interpreter's among them.
[profile.shipped]
inherits = "release"
lto = false
strip = "none"

# ri-gate's other builds, the tests among them: the same with debug assertions, so that
# `debug_assert!` and `cfg(debug_assertions)` code run in the tests (release turns them off).
[profile.gate]
inherits = "shipped"
debug-assertions = true

# Generated AOT parts: glue calling into opt-level 3 runtime crates; size wins over speed.
# @generated by crates/ricompiled/parts/mkparts.sh (checked by ricompiled-gen's build.rs).
[profile.release.package.ricompiled-p00]
opt-level = "s"

[profile.release.package.ricompiled-p01]
opt-level = "s"

[profile.release.package.ricompiled-p02]
opt-level = "s"

